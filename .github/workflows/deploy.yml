name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Substituir Secrets no HTML via Python
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          python3 -c "
          import os
          gemini = os.environ.get('GEMINI_KEY', '')
          maps = os.environ.get('MAPS_KEY', '')
          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          content = content.replace('__GEMINI_KEY__', gemini).replace('__MAPS_KEY__', maps)
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(content)
          "

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato preparado
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
