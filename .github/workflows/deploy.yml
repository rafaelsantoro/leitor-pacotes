name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Substituir Secrets no HTML
        run: |
          sed -i 's|__GEMINI_KEY__|${{ secrets.GEMINI_API_KEY }}|g' index.html
          sed -i 's|__MAPS_KEY__|${{ secrets.GOOGLE_MAPS_API_KEY }}|g' index.html

      - name: Configurar Pages
        uses: actions/configure-pages@v4

      - name: Enviar artefatos
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
