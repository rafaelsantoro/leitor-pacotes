name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Substituir Secrets no HTML
        run: |
          sed -i 's|__GEMINI_KEY__|${{ secrets.GEMINI_API_KEY }}|g' index.html
          sed -i 's|__MAPS_KEY__|${{ secrets.GOOGLE_MAPS_API_KEY }}|g' index.html

      - name: Deploy para o GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
